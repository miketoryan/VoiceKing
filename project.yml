name: VoiceKing

options:
  bundleIdPrefix: com.miketoryan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  VoiceKing:
    type: application
    platform: iOS
    sources:
      - path: VoiceKey
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miketoryan.VoiceKing
        PRODUCT_NAME: VoiceKing
        INFOPLIST_FILE: VoiceKey/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VoiceKingKeyboard
        embed: true

  VoiceKingKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VoiceKeyKeyboard
        excludes:
          - Resources
          - PinyinEngine.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miketoryan.VoiceKing.Keyboard
        PRODUCT_NAME: VoiceKingKeyboard
        INFOPLIST_FILE: VoiceKeyKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  VoiceKing:
    build:
      targets:
        VoiceKing: all
        VoiceKingKeyboard: all
    run:
      config: Debug
